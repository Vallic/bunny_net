bunny_net.settings:
  path: '/admin/config/development/bunny'
  defaults:
    _form: '\Drupal\bunny_net\Form\SettingsForm'
    _title: 'Bunny CDN'
  requirements:
    _permission: 'administer bunny_net'

bunny_net.purge_all:
  path: '/admin/config/development/bunny/purge'
  defaults:
    _form: '\Drupal\bunny_net\Form\PurgeAllForm'
    _title: 'Purge everything'
  requirements:
    _permission: 'purge bunny_net cache'
