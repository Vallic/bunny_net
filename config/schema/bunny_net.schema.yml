bunny_net.settings:
  type: config_object
  label: 'bunny.net settings'
  mapping:
    pull_zone_id:
      type: integer
      label: 'Pull zone ID'
    pull_zone_settings:
      type: sequence
      label: 'Pull zone settings, by bunny.net API name'
      sequence:
        type: bunny_net.pull_zone_setting
    error_page:
      type: mapping
      label: 'The page bunny.net shows when the site does not answer'
      mapping:
        file:
          type: string
          label: 'HTML file, relative to the Drupal root; empty for bunny.net''s page'
        whitelabel:
          type: boolean
          label: 'Leave bunny.net''s name off the page'
    purge:
      type: mapping
      label: 'Purging'
      mapping:
        enabled:
          type: boolean
          label: 'Purge the pull zone when Drupal invalidates cache tags'
        mode:
          type: string
          label: 'When to purge: terminate or queue'
          constraints:
            Choice:
              choices:
                - terminate
                - queue
        concurrency:
          type: integer
          label: 'Purge requests sent at once'
          constraints:
            Range:
              min: 1
              max: 50
        on_cache_rebuild:
          type: boolean
          label: 'Purge everything on a cache rebuild'
    tags:
      type: mapping
      label: 'Cache tags'
      mapping:
        header:
          type: boolean
          label: 'Add a CDN-Tag header to responses'
        prefix:
          type: string
          label: 'Tag prefix'
    edge_scripts:
      type: sequence
      label: 'Edge Scripts deployed from files'
      sequence:
        type: mapping
        label: 'Edge Script'
        mapping:
          script_id:
            type: integer
            label: 'Script ID'
          file:
            type: string
            label: 'File, relative to the Drupal root'
          variables:
            type: sequence
            label: 'Variables'
            sequence:
              type: string
              label: 'Value'
    edge_rules:
      type: mapping
      label: 'Edge Rules'
      mapping:
        directory:
          type: string
          label: 'Directory of rule files, relative to the Drupal root'
    caching:
      type: mapping
      label: 'Caching, written to the pull zone with drush bunny:caching-sync'
      mapping:
        enabled:
          type: boolean
          label: 'Manage the pull zone''s caching from here'
        dynamic:
          type: boolean
          label: 'Let bunny.net decide what is cacheable (Smart Cache)'
        vary:
          type: sequence
          label: 'What the cache varies on'
          sequence:
            type: string
            label: 'Vary'
            constraints:
              Choice:
                choices:
                  - webp
                  - avif
                  - mobile
                  - country
                  - country_state
                  - hostname
                  - cookie
        vary_headers:
          type: sequence
          label: 'Request headers the cache varies on'
          sequence:
            type: string
            label: 'Header'
        vary_cookies:
          type: sequence
          label: 'Cookies the cookie vary is keyed on'
          sequence:
            type: string
            label: 'Cookie'
        blocked_countries:
          type: sequence
          label: 'Countries answered with a 403'
          sequence:
            type: string
            label: 'ISO 3166-1 alpha-2 code'
        skip_paths:
          type: sequence
          label: 'Paths never cached'
          sequence:
            type: string
            label: 'Path'
        session_cookies:
          type: sequence
          label: 'Session cookies besides Drupal''s, or the start of their names'
          sequence:
            type: string
            label: 'Cookie'
        browser_pages:
          type: integer
          label: 'Seconds browsers keep a page; 0 leaves it to Drupal'
          constraints:
            Choice:
              choices: [0, 300, 900, 3600, 86400]
        browser_files:
          type: integer
          label: 'Seconds browsers keep a static file; 0 leaves it to Drupal'
          constraints:
            Choice:
              choices: [0, 86400, 604800, 2592000]

# A boolean, number, string, list or mapping, depending on the setting;
# PullZoneSettings checks each against the toolkit's PullZoneSettingsModel.
bunny_net.pull_zone_setting:
  type: ignore
  label: 'Pull zone setting'
